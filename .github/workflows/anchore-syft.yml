name: Anchore Syft SBOM scan

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:

permissions:
  contents: write

jobs:
  sbom:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: image.spdx.json
          dependency-snapshot: true
